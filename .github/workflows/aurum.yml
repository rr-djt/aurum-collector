# Aurum Terminal hourly rate collector.
# Lives at .github/workflows/aurum.yml in a SEPARATE PUBLIC repo that holds only
# collector.py and this file (public repos run Actions free and unlimited).
# Needs (Settings -> Secrets and variables -> Actions):
#   Variable  AURUM_SERVER  the licence server address, e.g. https://money-tracker-licence.<account>.workers.dev
#   Secret    AURUM_KEY     the Aurum key shown in Money Tracker -> Data -> Licences
# GitHub pauses schedules in repos with no activity for 60 days; the last step
# keeps it alive by recording the run time once a month.
name: Aurum rates

on:
  schedule:
    - cron: "7 * * * *"        # every hour at :07 (GitHub may start it a few minutes late)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Read the jewellers' rates and send them to the server
        env:
          AURUM_INGEST_TOKEN: ${{ secrets.AURUM_KEY }}
        run: python collector.py --post "${{ vars.AURUM_SERVER }}/aurum/ingest"
      - name: Keep the schedule alive (monthly)
        if: github.event_name == 'schedule'
        run: |
          month=$(date -u +%Y-%m)
          if [ "$(cat .last_month 2>/dev/null)" != "$month" ]; then
            echo "$month" > .last_month
            git config user.name "aurum-bot"
            git config user.email "aurum-bot@users.noreply.github.com"
            git add .last_month && git commit -q -m "keep schedule alive $month" && git push -q || true
          fi
